training:
  batch_size: 32
  epochs: 100
  learning_rate: 0.001
  early_stopping_patience: 10
  loss_weights:
    is_earthquake: 1.0
    intensity: 0.5
    pga: 0.3
    dominant_freq: 0.2
    duration: 0.2

data:
  # Raw input directories (used by scripts/prepare_dataset.py)
  stead_dir: "data/raw/stead"          # place STEAD .hdf5 files here
  phyphox_dir: "data/raw/phyphox"      # place Phyphox CSVs here (in earthquake/ and noise/ subdirs)

  # Processed dataset (output of prepare_dataset.py, input of train.py)
  processed_dir: "data/processed"

  # Balancing: randomly undersample STEAD to match Phyphox sample count
  # Strongly recommended when Phyphox is small (< 1000 samples)
  balance_stead_to_phyphox: true
  random_seed: 42

  sample_rate: 100    # Hz
  window_size: 1000   # samples per window (= 10 seconds)

  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
